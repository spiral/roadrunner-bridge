on:
  pull_request: null
  push:
    branches:
      - '*.*'

name: phpunit

jobs:
  phpunit:
    uses: spiral/gh-actions/.github/workflows/phpunit.yml@master
    with:
      install_protoc: true
      php: >-
        ['8.2', '8.3', '8.4', '8.5', '8.6']
      os: >-
        ['ubuntu-latest']
      stability: >-
        ['prefer-stable']
