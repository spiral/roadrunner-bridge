on:
  pull_request: null
  push:
    branches:
      - '*.*'

name: phpunit

jobs:
  phpunit:
    uses: spiral/gh-actions/.github/workflows/phpunit.yml@master
    with:
      install_protoc: true
      extensions: protobuf, sockets
      os: >-
        ['ubuntu-latest']
      stability: >-
        ['prefer-stable']
