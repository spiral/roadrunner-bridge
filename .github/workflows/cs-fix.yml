---

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - '**'

name: Fix Code Style

permissions:
  contents: write

jobs:
  cs-fix:
    uses: spiral/gh-actions/.github/workflows/cs-fix.yml@master
    with:
      php: '["8.2"]'
      bin-tool: code-style
      command: composer cs:fix
