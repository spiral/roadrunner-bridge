on:
  pull_request: null
  push:
    branches:
      - '*.*'

name: structarmed

jobs:
  structarmed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: composer structarmed
